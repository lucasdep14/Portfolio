<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Depoortere — Portfolio | Web & IT Specialist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- NAVIGATIE -->
    <header class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-900">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#home" class="font-semibold text-lg tracking-tight hover:text-indigo-400 transition-colors">
                Lucas Depoortere<span class="text-indigo-500">.</span>
            </a>
            <nav class="flex items-center gap-6 text-sm text-zinc-400">
                <a href="#over-mij" class="hover:text-zinc-100 transition-colors">Over mij</a>
                <a href="#projecten" class="hover:text-zinc-100 transition-colors">Projecten</a>
                <a href="#contact" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-100 rounded-lg font-medium border border-zinc-800 transition-all">Contact</a>
            </nav>
        </div>
    </header>

    <!-- APP CONTAINER (SPA ROUTER VIEW) -->
    <main id="app">
        <!-- DIT WORDT DYNAMISCH GEVULD OF GETOOND -->
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-zinc-900 py-8 px-6 text-center text-sm text-zinc-500">
        <p>&copy; 2026 Lucas Depoortere</p>
    </footer>

    <!-- JAVASCRIPT LOGICA & DATA -->
    <script>
        // HUIDIGE AFBEELDING INDEX VOOR SLIDER
        let currentImageIndex = 0;

        // DATA VAN AL JE PROJECTEN
        const projectsData = {
            'vdm-productions': { // Unieke ID voor het project
                title: "VDM Productions",
                category: "Client Project / Showcase Website", // Categorie van het project
                shortDesc: "Moderne, responsieve website voor een verhuurder van licht- en geluidsapparatuur.", // Korte beschrijving
                fullDesc: "Voor VDM Productions is een strakke website ontwikkeld die volledig aansluit bij de professionele uitrusting van het verhuurbedrijf. Het doel was om bezoekers in één oogopslag een helder overzicht te geven van het aanbod in licht- en geluidstechniek, met een sterke focus op gebruikersgemak en snelle offerteaanvragen.",
                features: [ // Belangrijkste functionaliteiten
                    "Volledig responsive design",
                    "Duidelijke categorisering van licht- en geluidsverhuur",
                    "Geoptimaliseerd voor snelle laadtijden en SEO",
                    "Directe en laagdrempelige contactopties"
                ],
                tech: ["HTML5", "CSS3"],
                liveUrl: "https://lucasdep14.github.io/VDM-Productions/",
                images: ["images/VDM_Site.png"]
            },
            'medconnect': {
                title: "MedConnect",
                category: "Full-Stack Web App / Eindwerk",
                shortDesc: "Totaaloplossing ontwikkeld als eindwerk voor gegevensbeheer en communicatie in de medische sector.",
                fullDesc: "MedConnect is een full-stack webapplicatie ontworpen in Blazor om de administratieve lasten binnen de gezondheidszorg te verlichten. Het systeem stelt zorgverleners in staat om gestructureerd en vooral veilig gegevens te beheren, met grootte aandacht voor privacy en een makkelijke gebruikerservaring.",
                features: [
                    "Beveiligde authenticatie en rollenbeheer",
                    "Gestructureerde databasestructuur voor gevoelige gegevens",
                    "Intuïtief dashboard met real-time overzichten",
                    "Volledige documentatie en ontwikkelingscyclus doorlopen",
                    "Hardware en sensoren uitlezen met een ESP-32"
                ],
                tech: ["Blazor", "MS SQL Server", "Bootstrap", "Github"],
                githubUrl: "https://github.com/lucasdep14/Medconnect",
                images: [
                    "images/metingen_MedConnect.png",
                    "images/historiek_MedConnect.png",
                    "images/printplaat_MedConnect.png"
                ]
            }
        };

        // HTML TEMPLATES VOOR DE WEERGAVE
        const homeTemplate = `
            <!-- HERO SECTION MET BREDE FOTO & NAAM RECHTS -->
            <section id="over-mij" class="py-12 px-6 max-w-6xl mx-auto">
                <div class="relative overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-900">
                    <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[480px]">
                        
                        <!-- FOTO LINKS (BREED OP SPOTS) -->
                        <div class="lg:col-span-6 relative h-72 lg:h-auto overflow-hidden">
                            <img src="images/Foto_Lucas.png" alt="Lucas Depoortere" class="w-full h-full object-cover object-top filter brightness-95 contrast-105">
                            <div class="absolute inset-0 bg-gradient-to-t lg:bg-gradient-to-r from-transparent via-zinc-900/40 to-zinc-900"></div>
                        </div>

                        <!-- TEKST & NAAM RECHTS -->
                        <div class="lg:col-span-6 p-8 sm:p-12 flex flex-col justify-center relative z-10 bg-zinc-900/90 lg:bg-transparent">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-medium mb-4 w-max">
                                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span> Student-Zelfstandige
                            </div>
                            
                            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-zinc-100 mb-2">
                                Lucas Depoortere
                            </h1>
                            <p class="text-lg font-medium text-indigo-400 mb-6">
                                Web Development & Infrastructure Specialist
                            </p>
                            
                            <p class="text-zinc-400 text-sm sm:text-base leading-relaxed mb-6">
                                Als student-zelfstandige bouw ik moderne websites, custom software en betrouwbare IT-oplossingen. Momenteel studeer ik <strong class="text-zinc-200">Toegepaste Informatica</strong> aan VIVES met de afstudeerrichting <strong class="text-zinc-200">Cybersecurity en Infrastructure</strong>.
                            </p>

                            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-zinc-800/80 text-xs mb-8">
                                <div>
                                    <span class="block text-zinc-500">Opleiding</span>
                                    <span class="font-medium text-zinc-200">Toegepaste Informatica</span>
                                </div>
                                <div>
                                    <span class="block text-zinc-500">Specialisatie</span>
                                    <span class="font-medium text-indigo-400">Cybersecurity & Infrastructure</span>
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-3">
                                <a href="#projecten" class="px-5 py-2.5 bg-zinc-100 text-zinc-950 text-sm font-medium rounded-lg hover:bg-zinc-200 transition-colors">
                                    Bekijk projecten
                                </a>
                                <a href="#contact" class="px-5 py-2.5 bg-zinc-800 border border-zinc-700 text-zinc-200 text-sm font-medium rounded-lg hover:bg-zinc-700 transition-colors">
                                    Contacteer mij
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <!-- PROJECTEN SECTIE -->
            <section id="projecten" class="py-16 px-6 max-w-6xl mx-auto border-t border-zinc-900">
                <div class="mb-12">
                    <h2 class="text-2xl font-bold tracking-tight mb-2">Uitgelichte Projecten</h2>
                    <p class="text-zinc-400 text-sm">Een greep uit wat ik heb gebouwd en opgeleverd voor klanten en studie.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- VDM Productions -->
                    <div onclick="navigateTo('vdm-productions')" class="group cursor-pointer bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-6 hover:border-zinc-700 transition-all flex flex-col justify-between">
                        <div>
                            <span class="text-xs font-medium text-indigo-400 uppercase tracking-wider">Client Project</span>
                            <h3 class="text-xl font-semibold mt-2 group-hover:text-indigo-400 transition-colors">VDM Productions (MVLS Renting)</h3>
                            <p class="text-zinc-400 text-sm mt-3 leading-relaxed">Moderne, responsieve showcase website voor verhuur van licht- en geluidsapparatuur.</p>
                        </div>
                        <div class="mt-6">
                            <div class="flex flex-wrap gap-2 mb-6">
                                <span class="text-xs px-2.5 py-1 bg-zinc-800/60 rounded-md text-zinc-300">HTML5</span>
                                <span class="text-xs px-2.5 py-1 bg-zinc-800/60 rounded-md text-zinc-300">CSS3</span>
                            </div>
                            <span class="text-sm font-medium text-zinc-200 inline-flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                Bekijk project &rarr;
                            </span>
                        </div>
                    </div>

                    <!-- MedConnect -->
                    <div onclick="navigateTo('medconnect')" class="group cursor-pointer bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-6 hover:border-zinc-700 transition-all flex flex-col justify-between">
                        <div>
                            <span class="text-xs font-medium text-indigo-400 uppercase tracking-wider">Eindwerk / Full-Stack</span>
                            <h3 class="text-xl font-semibold mt-2 group-hover:text-indigo-400 transition-colors">MedConnect</h3>
                            <p class="text-zinc-400 text-sm mt-3 leading-relaxed">Totaaloplossing voor gegevensbeheer en communicatie in de gezondheidszorg.</p>
                        </div>
                        <div class="mt-6">
                            <div class="flex flex-wrap gap-2 mb-6">
                                <span class="text-xs px-2.5 py-1 bg-zinc-800/60 rounded-md text-zinc-300">Blazor</span>
                                <span class="text-xs px-2.5 py-1 bg-zinc-800/60 rounded-md text-zinc-300">MS SQL Server</span>
                                <span class="text-xs px-2.5 py-1 bg-zinc-800/60 rounded-md text-zinc-300">Bootstrap</span>
                            </div>
                            <span class="text-sm font-medium text-zinc-200 inline-flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                Bekijk project &rarr;
                            </span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SKILLS SECTIE -->
            <section class="py-16 px-6 max-w-6xl mx-auto border-t border-zinc-900">
                <h2 class="text-2xl font-bold tracking-tight mb-8">Tech Stack & Vaardigheden</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="bg-zinc-900/30 border border-zinc-800/60 rounded-xl p-6">
                        <h3 class="font-semibold text-zinc-200 mb-4">Frontend & Web</h3>
                        <ul class="space-y-2 text-sm text-zinc-400">
                            <li>• HTML5 / CSS3</li>
                            <li>• Tailwind CSS / Bootstrap</li>
                            <li>• JavaScript (ES6+)</li>
                            <li>• Responsive Design</li>
                        </ul>
                    </div>
                    <div class="bg-zinc-900/30 border border-zinc-800/60 rounded-xl p-6">
                        <h3 class="font-semibold text-zinc-200 mb-4">Backend & Database</h3>
                        <ul class="space-y-2 text-sm text-zinc-400">
                            <li>• Blazor / C#</li>
                            <li>• PHP & Laravel</li>
                            <li>• MS SQL Server / MySQL</li>
                            <li>• Auth & Security Basics</li>
                        </ul>
                    </div>
                    <div class="bg-zinc-900/30 border border-zinc-800/60 rounded-xl p-6">
                        <h3 class="font-semibold text-zinc-200 mb-4">DevOps & Systems</h3>
                        <ul class="space-y-2 text-sm text-zinc-400">
                            <li>• Linux (Server Admin)</li>
                            <li>• Docker Containers</li>
                            <li>• TrueNAS / Storage</li>
                            <li>• Netwerkbeheer</li>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- CONTACT SECTIE -->
            <section id="contact" class="py-16 px-6 max-w-6xl mx-auto border-t border-zinc-900 mb-12">
                <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-8 sm:p-12">
                    <div class="max-w-xl">
                        <h2 class="text-2xl font-bold tracking-tight mb-2">Laten we samenwerken</h2>
                        <p class="text-zinc-400 text-sm mb-6">Heb je een vraag, een project in gedachten of wil je sparren over IT-infrastructuur? Stuur gerust een bericht.</p>
                        
                        <form onsubmit="event.preventDefault(); alert('Bedankt voor je bericht!');" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-zinc-400 mb-1">Naam</label>
                                <input type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-zinc-400 mb-1">E-mailadres</label>
                                <input type="email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-zinc-400 mb-1">Bericht</label>
                                <textarea rows="4" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 transition-colors"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-colors text-sm">
                                Verstuur bericht
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        `;

        // DETAILPAGINA TEMPLATE VOOR PROJECTEN MET CAROUSEL
        function getProjectDetailTemplate(projectId) {
            const project = projectsData[projectId];
            if (!project) return `<div class="py-24 text-center">Project niet gevonden. <a href="#" onclick="navigateToHome()" class="text-indigo-400 underline">Terug naar home</a></div>`;

            const hasMultipleImages = project.images && project.images.length > 1;

            return `
                <section class="py-16 px-6 max-w-4xl mx-auto">
                    <!-- TERUG KNOP -->
                    <button onclick="navigateToHome()" class="inline-flex items-center gap-2 text-sm text-zinc-400 hover:text-zinc-100 mb-8 transition-colors">
                        &larr; Terug naar overzicht
                    </button>

                    <!-- HEADER MET DYNAMISCHE EXTERNE KNOPPEN -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                        <div>
                            <span class="text-xs font-medium text-indigo-400 uppercase tracking-wider">${project.category}</span>
                            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-zinc-100 mt-2">${project.title}</h1>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            ${project.liveUrl ? `
                                <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors inline-flex items-center gap-2">
                                    Bekijk live site &rarr;
                                </a>
                            ` : ''}
                            ${project.githubUrl ? `
                                <a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-200 text-sm font-medium rounded-lg transition-colors inline-flex items-center gap-2">
                                    GitHub Repository &rarr;
                                </a>
                            ` : ''}
                        </div>
                    </div>

                    <p class="text-lg text-zinc-300 leading-relaxed mb-8">${project.shortDesc}</p>

                    <!-- TECHNOLOGIEËN BADGES -->
                    <div class="flex flex-wrap gap-2 mb-10 pb-8 border-b border-zinc-900">
                        ${project.tech.map(t => `<span class="text-xs px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-300">${t}</span>`).join('')}
                    </div>

                    <!-- FOTO CAROUSEL (SLIDER) -->
                    ${project.images && project.images.length > 0 ? `
                        <div class="mb-12 space-y-4">
                            <h2 class="text-xl font-semibold text-zinc-200">Screenshots & Previews</h2>
                            <div class="relative rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900 group">
                                <img id="slider-image" src="${project.images[currentImageIndex]}" alt="${project.title} preview" class="w-full h-auto object-cover max-h-[500px]">
                                
                                ${hasMultipleImages ? `
                                    <!-- KNOP VORIGE -->
                                    <button onclick="prevImage('${projectId}')" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-zinc-950/80 border border-zinc-700 text-white flex items-center justify-center hover:bg-indigo-600 hover:border-indigo-500 transition-colors shadow-lg">
                                        &#10094;
                                    </button>
                                    <!-- KNOP VOLGENDE -->
                                    <button onclick="nextImage('${projectId}')" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-zinc-950/80 border border-zinc-700 text-white flex items-center justify-center hover:bg-indigo-600 hover:border-indigo-500 transition-colors shadow-lg">
                                        &#10095;
                                    </button>
                                    <!-- TELLER ONDERIN -->
                                    <div class="absolute bottom-3 right-3 px-3 py-1 bg-zinc-950/80 border border-zinc-800 rounded-md text-xs text-zinc-300 font-mono">
                                        <span id="slider-counter">1</span> / ${project.images.length}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}

                    <!-- VOLLEDIGE UITLEG -->
                    <div class="space-y-6 text-zinc-400 leading-relaxed">
                        <h2 class="text-xl font-semibold text-zinc-200">Over dit project</h2>
                        <p>${project.fullDesc}</p>

                        <h2 class="text-xl font-semibold text-zinc-200 pt-4">Belangrijkste functionaliteiten & kenmerken</h2>
                        <ul class="space-y-3">
                            ${project.features.map(f => `<li class="flex items-start gap-3"><span class="text-indigo-400 mt-1">&#10003;</span> <span>${f}</span></li>`).join('')}
                        </ul>
                    </div>

                    <!-- ONDERSTE ACTIE -->
                    <div class="mt-16 pt-8 border-t border-zinc-900 flex gap-4">
                        <button onclick="navigateToHome()" class="px-6 py-3 bg-zinc-900 border border-zinc-800 text-zinc-200 font-medium rounded-lg hover:bg-zinc-800 transition-colors text-sm">
                            Terug naar alle projecten
                        </button>
                    </div>
                </section>
            `;
        }

        // SLIDER NAVIGATIE FUNCTIES
        function nextImage(projectId) {
            const images = projectsData[projectId].images;
            currentImageIndex = (currentImageIndex + 1) % images.length;
            updateSlider(images);
        }

        function prevImage(projectId) {
            const images = projectsData[projectId].images;
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            updateSlider(images);
        }

        function updateSlider(images) {
            const imgEl = document.getElementById('slider-image');
            const counterEl = document.getElementById('slider-counter');
            if (imgEl) imgEl.src = images[currentImageIndex];
            if (counterEl) counterEl.textContent = currentImageIndex + 1;
        }

        // ROUTING LOGICA (HASH BASED)
        function router() {
            const hash = window.location.hash;
            const appContainer = document.getElementById('app');

            if (hash.startsWith('#/project/')) {
                const projectId = hash.replace('#/project/', '');
                currentImageIndex = 0; // Reset index bij het openen van een project
                appContainer.innerHTML = getProjectDetailTemplate(projectId);
                window.scrollTo(0, 0);
            } else {
                appContainer.innerHTML = homeTemplate;
                if (hash && hash !== '#home') {
                    const el = document.querySelector(hash);
                    if (el) el.scrollIntoView();
                } else {
                    window.scrollTo(0, 0);
                }
            }
        }

        function navigateTo(projectId) {
            window.location.hash = `#/project/${projectId}`;
        }

        function navigateToHome() {
            window.location.hash = '#home';
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);
    </script>
</body>
</html>
