<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Vibrant Indigo Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Box / App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Logo Monogram Group -->
  <g filter="url(#glow)">
    <!-- Letter L: Left Vertical & Horizontal Baseline -->
    <path d="M 136 136 L 192 136 L 192 320 L 316 320 L 316 376 L 136 376 Z" 
          fill="#f4f4f5"/>

    <!-- Letter D: Interlocking Modern Geometry -->
    <path d="M 236 136 L 316 136 C 380 136, 408 174, 408 240 C 408 306, 376 348, 312 348 L 268 348 L 268 296 L 308 296 C 342 296, 352 272, 352 240 C 352 208, 340 188, 308 188 L 236 188 Z" 
          fill="url(#indigoGrad)"/>
          
    <!-- Digital Accent Dot / Port indicator -->
    <circle cx="214" cy="162" r="14" fill="url(#cyanAccent)"/>
  </g>
</svg>
